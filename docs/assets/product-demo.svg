<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">mordn docs assistant with cited answers</title>
  <desc id="desc">A product demonstration showing a user asking how chat privacy works and a mordn assistant returning a grounded answer with citations.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe9ff"/>
      <stop offset="1" stop-color="#705cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#16161d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f7f8"/>
  <path d="M0 88H1200M454 88V720" stroke="#dedee3"/>
  <text x="56" y="55" fill="#c45813" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">mordn</text>
  <text x="168" y="55" fill="#1b1b20" font-family="Inter, Arial, sans-serif" font-size="17">Live docs assistant</text>
  <circle cx="1110" cy="45" r="7" fill="#22b573"/>
  <text x="1128" y="51" fill="#55545f" font-family="Inter, Arial, sans-serif" font-size="14">real route</text>

  <g transform="translate(54 145)">
    <text fill="#bd5516" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">GROUNDED ANSWERS</text>
    <text y="58" fill="#17171c" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="700">A docs assistant</text>
    <text y="108" fill="#17171c" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="700">that cites its sources.</text>
    <text y="164" fill="#676672" font-family="Inter, Arial, sans-serif" font-size="18">Retrieval, persistence, and citations are built in.</text>

    <g transform="translate(0 218)" font-family="Inter, Arial, sans-serif">
      <circle cx="16" cy="16" r="16" fill="#eeeefe"/><text x="12" y="22" fill="#5b50d8" font-size="15" font-weight="700">1</text>
      <text x="48" y="9" fill="#24242a" font-size="17" font-weight="700">Your docs are the knowledge base</text>
      <text x="48" y="36" fill="#6b6a75" font-size="16">Answers link back to the exact source.</text>

      <circle cx="16" cy="92" r="16" fill="#eeeefe"/><text x="12" y="98" fill="#5b50d8" font-size="15" font-weight="700">2</text>
      <text x="48" y="85" fill="#24242a" font-size="17" font-weight="700">Identity stays server-verified</text>
      <text x="48" y="112" fill="#6b6a75" font-size="16">The browser never asserts who it is.</text>

      <circle cx="16" cy="168" r="16" fill="#eeeefe"/><text x="12" y="174" fill="#5b50d8" font-size="15" font-weight="700">3</text>
      <text x="48" y="161" fill="#24242a" font-size="17" font-weight="700">Your model runs in your route</text>
      <text x="48" y="188" fill="#6b6a75" font-size="16">Tools and inference stay in your app.</text>
    </g>

    <rect y="462" width="348" height="52" rx="10" fill="#17171c"/>
    <text x="88" y="495" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Open the live showcase ↗</text>
  </g>

  <rect x="512" y="132" width="630" height="530" rx="28" fill="url(#panel)"/>
  <g filter="url(#shadow)">
    <rect x="574" y="176" width="506" height="442" rx="18" fill="#fff"/>
  </g>
  <path d="M574 226H1080" stroke="#ececf0"/>
  <text x="600" y="210" fill="#292930" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Chat privacy and identity</text>
  <circle cx="1036" cy="201" r="5" fill="#22b573"/>

  <rect x="752" y="249" width="296" height="62" rx="15" fill="#5848e8"/>
  <text x="775" y="276" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15">What stops a user from reading</text>
  <text x="775" y="298" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15">someone else’s chat?</text>

  <text x="606" y="352" fill="#8b8994" font-family="Inter, Arial, sans-serif" font-size="12">SEARCHED THE DOCS · 4 SOURCES</text>
  <text x="606" y="386" fill="#292930" font-family="Inter, Arial, sans-serif" font-size="16">Identity is resolved from your verified server</text>
  <text x="606" y="411" fill="#292930" font-family="Inter, Arial, sans-serif" font-size="16">session—not a user id supplied by the browser.</text>
  <text x="606" y="449" fill="#292930" font-family="Inter, Arial, sans-serif" font-size="16">The handler then binds persistence and storage</text>
  <text x="606" y="474" fill="#292930" font-family="Inter, Arial, sans-serif" font-size="16">to that identity before reading any conversation.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="606" y="506" width="111" height="30" rx="15" fill="#f0efff"/>
    <text x="624" y="526" fill="#5146c9">1 · Security</text>
    <rect x="727" y="506" width="126" height="30" rx="15" fill="#f0efff"/>
    <text x="745" y="526" fill="#5146c9">2 · Quickstart</text>
    <rect x="863" y="506" width="118" height="30" rx="15" fill="#f0efff"/>
    <text x="881" y="526" fill="#5146c9">3 · Handler</text>
  </g>

  <rect x="600" y="558" width="454" height="42" rx="11" fill="#f7f7f9" stroke="#e4e3e8"/>
  <text x="619" y="584" fill="#9a98a3" font-family="Inter, Arial, sans-serif" font-size="14">Ask anything…</text>
  <circle cx="1029" cy="579" r="14" fill="#e7e6ec"/>
  <path d="M1023 580L1029 574L1035 580M1029 574V585" fill="none" stroke="#777580" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
